<h1 class="mat-headline-4" style="margin: 0">All Sets</h1>
<div class="page-content">
  <mat-form-field appearance="outline" (change)="onSearchTyped()">
    <mat-label>Search query</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput type="text" [formControl]="searchControl" />
  </mat-form-field>
  @if (!isLoading && !isError) {
    <set-grid [sets]="currentSets" [mode]="'notOwner'"></set-grid>
  }
  @if (isLoading && !isError) {
    <div class="loaderContainer">
      <mat-progress-spinner diameter="24" mode="indeterminate"></mat-progress-spinner>
    </div>
  }
  @if (currentSets.length === 0 && !isLoading && !isError) {
    <p>Whooaaa, so empty here...</p>
  }
  @if (isError) {
    <error componentName="All Sets" (retry)="onRetryClicked()"></error>
  }
  @if (pagesCount !== 1) {
    <mat-paginator
      hidePageSize="true"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      [length]="pagesCount * pageSize"
      (page)="onPageChanged($event)">
    </mat-paginator>
  }
</div>
